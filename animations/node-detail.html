<!-- ── Packets layer (always on top) ── -->
<g id="packets"/>

</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const TRAVEL_SPEED = 280; // SVG units per second

  // sid = 1-based SVG element suffix ("e2sar-1" / "e2sar-2")
  const NODES = [
    { sid: 1, top: 58,  ejfat_y: 350, qDepth: 0, shmWrites: 0, events: 0, pktColor: '#0099cc' },
    { sid: 2, top: 423, ejfat_y: 458, qDepth: 0, shmWrites: 0, events: 0, pktColor: '#e05820' },
  ];

  // ── helpers ──────────────────────────────────────────────

  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function flyPkt(x1, y1, x2, y2, color, onDone) {
    const g    = document.createElementNS(NS, 'g');
    const halo = document.createElementNS(NS, 'rect');
    halo.setAttribute('x', x1 - 9);   halo.setAttribute('y', y1 - 7);
    halo.setAttribute('width', 18);    halo.setAttribute('height', 14);
    halo.setAttribute('rx', 4);        halo.setAttribute('fill', color);
    halo.setAttribute('opacity', '0.25');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', x1 - 7);   rect.setAttribute('y', y1 - 4.5);
    rect.setAttribute('width', 14);    rect.setAttribute('height', 9);
    rect.setAttribute('rx', 2);        rect.setAttribute('fill', color);
    g.appendChild(halo);
    g.appendChild(rect);
    document.getElementById('packets').appendChild(g);
    const d   = dist(x1, y1, x2, y2);
    const dur = d / TRAVEL_SPEED;
    gsap.to(rect, { attr: { x: x2 - 7,  y: y2 - 4.5 }, duration: dur, ease: 'none' });
    gsap.to(halo, {
      attr: { x: x2 - 9, y: y2 - 7 }, duration: dur, ease: 'none',
      onComplete: () => { g.remove(); if (onDone) onDone(); }
    });
  }

  // flash the background rect of a named group
  function flashEl(groupId, brightColor, duration) {
    const grp = document.getElementById(groupId);
    if (!grp) return;
    const r = grp.querySelector('rect');
    if (!r) return;
    // Cache baseline on first call so re-entrant flashes never ratchet up the width
    if (!r.dataset.baseStroke) {
      r.dataset.baseStroke = r.getAttribute('stroke');
      r.dataset.baseWidth  = r.getAttribute('stroke-width') || '1.5';
    }
    const origStroke = r.dataset.baseStroke;
    const origWidth  = parseFloat(r.dataset.baseWidth);
    gsap.killTweensOf(r);
    gsap.set(r, { attr: { stroke: origStroke, 'stroke-width': origWidth } });
    gsap.to(r, {
      attr: { stroke: brightColor, 'stroke-width': origWidth + 1.5 }, duration: 0.1,
      onComplete: () => gsap.to(r, {
        attr: { stroke: origStroke, 'stroke-width': origWidth }, duration: duration || 0.3
      })
    });
  }

  // animate EJFAT W1/W2 distribution bars proportionally
  function updateDistBars() {
    const total = NODES[0].events + NODES[1].events;
    if (total === 0) return;
    const maxW = 70;
    NODES.forEach(node => {
      const w = Math.round((node.events / total) * maxW);
      gsap.to(document.getElementById('dist-n' + node.sid), {
        attr: { width: w }, duration: 0.6, ease: 'power2.out'
      });
    });
  }

  // leave a stationary packet in the packets layer (caller removes it)
  function parkPkt(x, y, color) {
    const g    = document.createElementNS(NS, 'g');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', x - 7);  rect.setAttribute('y', y - 4.5);
    rect.setAttribute('width', 14); rect.setAttribute('height', 9);
    rect.setAttribute('rx', 2);     rect.setAttribute('fill', color);
    g.appendChild(rect);
    document.getElementById('packets').appendChild(g);
    return g;
  }

  // flash the SEM badge in a SHMEM segment
  function flashSem(sid) {
    const el = document.getElementById('sem-' + sid);
    if (!el) return;
    gsap.to(el, { attr: { fill: '#dd55ff' }, duration: 0.12,
      onComplete: () => gsap.to(el, { attr: { fill: '#9933bb' }, duration: 0.5 })
    });
  }

  // opacity-pulse a glow rect (already has blur-glow filter)
  function glowPulse(id, peakOpacity, fadeDur) {
    gsap.to(document.getElementById(id), {
      opacity: peakOpacity, duration: 0.15,
      onComplete: () => gsap.to(document.getElementById(id), { opacity: 0, duration: fadeDur || 0.4 })
    });
  }

  // ── per-node event loop ──────────────────────────────────

  function schedEventArrival(node, delay) {
    gsap.delayedCall(delay, () => {
      const cy  = node.top + 161; // ERSAP pipeline center_y
      const sid = node.sid;

      // 1. EJFAT → E2SAR Receiver (diagonal) — packet train
      const trainSize  = 3 + Math.floor(Math.random() * 3); // 3–5 packets
      const trainColor = node.pktColor; // capture color for this train
      let arrivedCount = 0;
      for (let pi = 0; pi < trainSize; pi++) {
        gsap.delayedCall(pi * 0.13, () => {
          flyPkt(112, node.ejfat_y, 170, cy, trainColor, () => {
            flashEl('e2sar-' + sid, '#00ccff', 0.2);
            node.qDepth = Math.min(node.qDepth + 1, 5);
            document.getElementById('queue-depth-' + sid).textContent = node.qDepth;
            arrivedCount++;
            if (arrivedCount === trainSize) {
              // all packets assembled — event now enters the queue
              node.events++;
              updateDistBars();
              triggerChain();
            }
          });
        });
      }

      function triggerChain() {
        // 2. Assembled event parks in queue slot for 1 s, then exits to GlueX Analyzer
        const qSlot   = Math.floor(Math.random() * 5);
        const qSlotY  = node.top + 121 + qSlot * 20;
        const parkedEv = parkPkt(239, qSlotY, '#c89000');

        gsap.delayedCall(1.0, () => {
          node.qDepth = Math.max(node.qDepth - 1, 0);
          document.getElementById('queue-depth-' + sid).textContent = node.qDepth;
          gsap.to(parkedEv, { opacity: 0, duration: 0.15, onComplete: () => parkedEv.remove() });

          flyPkt(261, cy, 374, cy, '#c89000', () => {
            flashEl('analyzer-' + sid, '#ff9955', 0.3);

            // 3. Analyzer → SHMem Interface (after processing delay)
            gsap.delayedCall(0.2 + Math.random() * 0.2, () => {
              flyPkt(510, cy, 524, cy, '#e05820', () => {
                flashEl('shm-if-' + sid, '#6699cc', 0.25);
                node.shmWrites++;
                document.getElementById('shm-writes-' + sid).textContent = node.shmWrites;

                // 4. SHMem Interface → SHMEM slot (packet parks for 1 s, SEM lights up)
                gsap.delayedCall(0.15, () => {
                  const slotIdx = 1 + Math.floor(Math.random() * 8); // slots 1–8 (below header)
                  const slotY   = node.top + 66 + slotIdx * 22;      // stripe y positions
                  flyPkt(660, cy, 766, slotY, '#4a70a0', () => {
                    glowPulse('shmem-glow-write-' + sid, 0.4, 0.5);
                    const parked = parkPkt(766, slotY, '#4a70a0');

                    // hold 1 s in slot, then SEM fires and packet exits
                    gsap.delayedCall(1.0, () => {
                      flashSem(sid);
                      gsap.to(parked, { opacity: 0, duration: 0.15,
                        onComplete: () => parked.remove() });

                      // 5. SHMEM → random SAGIPS proc (read pulse)
                      const procIdx = Math.floor(Math.random() * 4);
                      const procY   = node.top + 82 + 68 * procIdx;
                      glowPulse('shmem-glow-read-' + sid, 0.35, 0.4);

                      flyPkt(800, slotY, 830, procY, '#4a70a0', () => {
                        flashEl('proc-' + sid + '-' + procIdx, '#6699cc', 0.3);
                        flashEl('gpu-'  + sid + '-' + procIdx, '#00aaee', 0.3);

                        // alternate sender color (cyan ↔ orange) then reschedule
                        node.pktColor = (node.pktColor === '#0099cc') ? '#e05820' : '#0099cc';
                        schedEventArrival(node, 2.5 + Math.random() * 1.0);
                      });
                    });
                  });
                });
              });
            });
          });
        });
      }  // triggerChain
    });
  }

  // ── Phase 3: helpers ─────────────────────────────────────────────────

  function cubicBez(t, p0, p1, p2, p3) {
    const mt = 1 - t, mt2 = mt * mt, mt3 = mt2 * mt;
    const t2 = t * t, t3 = t2 * t;
    return {
      x: mt3*p0.x + 3*mt2*t*p1.x + 3*mt*t2*p2.x + t3*p3.x,
      y: mt3*p0.y + 3*mt2*t*p1.y + 3*mt*t2*p2.y + t3*p3.y,
    };
  }

  function ringPos(segs, ringT) {
    const n = segs.length;
    const w = ((ringT % n) + n) % n;
    const seg = segs[Math.floor(w)];
    return cubicBez(w - Math.floor(w), seg.p0, seg.p1, seg.p2, seg.p3);
  }

  function makeIntraSegs(top) {
    const ys = [0, 1, 2, 3].map(i => top + 82 + 68 * i);
    return [
      { p0:{x:1071,y:ys[0]}, p1:{x:1148,y:ys[0]}, p2:{x:1148,y:ys[1]}, p3:{x:1071,y:ys[1]} },
      { p0:{x:1071,y:ys[1]}, p1:{x:1148,y:ys[1]}, p2:{x:1148,y:ys[2]}, p3:{x:1071,y:ys[2]} },
      { p0:{x:1071,y:ys[2]}, p1:{x:1148,y:ys[2]}, p2:{x:1148,y:ys[3]}, p3:{x:1071,y:ys[3]} },
      { p0:{x:1071,y:ys[3]}, p1:{x:1165,y:ys[3]+40}, p2:{x:1165,y:ys[0]-40}, p3:{x:1071,y:ys[0]} },
    ];
  }

  // inter-node arc control points match the static SVG paths (C 1183,…)
  const INTER_SEGS = [
    { p0:{x:1071,y:344}, p1:{x:1183,y:404}, p2:{x:1183,y:445}, p3:{x:1071,y:505} },
    { p0:{x:1071,y:505}, p1:{x:1183,y:445}, p2:{x:1183,y:404}, p3:{x:1071,y:344} },
  ];

  const DIAM_S        = 9;
  const RING_COLOR    = '#9933bb';
  const INTRA_DUR     = 4.5;
  const INTER_DUR     = 3.5;

  function makeRingDiamond() {
    const g    = document.createElementNS(NS, 'g');
    const gs   = DIAM_S + 8;
    const glow = document.createElementNS(NS, 'rect');
    Object.entries({
      width: gs, height: gs, x: -gs/2, y: -gs/2, rx: 2,
      fill: RING_COLOR, opacity: 0.2, transform: 'rotate(45)',
    }).forEach(([k, v]) => glow.setAttribute(k, v));
    g.appendChild(glow);
    const body = document.createElementNS(NS, 'rect');
    Object.entries({
      width: DIAM_S, height: DIAM_S, x: -DIAM_S/2, y: -DIAM_S/2, rx: 1.5,
      fill: RING_COLOR, opacity: 1, transform: 'rotate(45)', filter: 'url(#glow-purple)',
    }).forEach(([k, v]) => body.setAttribute(k, v));
    g.appendChild(body);
    document.getElementById('packets').appendChild(g);
    return g;
  }

  function startIntraNodeRing(node) {
    const segs = makeIntraSegs(node.top);
    const n    = 3; // diamonds per node
    for (let i = 0; i < n; i++) {
      const diamond = makeRingDiamond();
      const state   = { t: (i / n) * segs.length };
      gsap.to(state, {
        t: state.t + segs.length, duration: INTRA_DUR, ease: 'none', repeat: -1,
        onUpdate() {
          const { x, y } = ringPos(segs, state.t);
          diamond.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
        },
      });
    }
  }

  function startInterNodeRing() {
    const n = 2; // one each direction
    for (let i = 0; i < n; i++) {
      const diamond = makeRingDiamond();
      const state   = { t: (i / n) * INTER_SEGS.length };
      gsap.to(state, {
        t: state.t + INTER_SEGS.length, duration: INTER_DUR, ease: 'none', repeat: -1,
        onUpdate() {
          const { x, y } = ringPos(INTER_SEGS, state.t);
          diamond.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
        },
      });
    }
  }

  function schedControlFeedback(node, delay) {
    const cy = node.top + 161;
    gsap.delayedCall(delay, () => {
      const x1 = 173, y1 = cy + 3, x2 = 115, y2 = node.ejfat_y + 3;
      const c  = document.createElementNS(NS, 'circle');
      Object.entries({ r: 3.5, cx: x1, cy: y1,
        fill: 'none', stroke: '#6090b8', 'stroke-width': 1.3, opacity: 0.7 })
        .forEach(([k, v]) => c.setAttribute(k, v));
      document.getElementById('packets').appendChild(c);
      const d = dist(x1, y1, x2, y2) / (TRAVEL_SPEED * 0.75);
      gsap.to(c, { attr: { cx: x2, cy: y2 }, duration: d, ease: 'none',
        onComplete: () => c.remove() });
      schedControlFeedback(node, 1.0 + Math.random() * 0.8);
    });
  }

  // ── MLFlow model-snapshot animation ──────────────────────────
  const MLFLOW_CX = 1324, MLFLOW_CY = 327;
  const PROC0_SOURCES = [
    { x: 1071, y: 140 },  // Node 1 PROC 0 GPU right edge
    { x: 1071, y: 505 },  // Node 2 PROC 0 GPU right edge
  ];
  let mlflowVersion = 0, mlflowSaves = 0;

  function makeSnapshotPkt(wx, wy) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${wx}, ${wy})`);

    const halo = document.createElementNS(NS, 'circle');
    Object.entries({ r: 11, cx: 0, cy: 0, fill: '#18b068', opacity: 0.15 })
      .forEach(([k, v]) => halo.setAttribute(k, v));
    g.appendChild(halo);

    const body = document.createElementNS(NS, 'polygon');
    body.setAttribute('points', '-5,-6 3,-6 6,-3 6,6 -5,6');
    body.setAttribute('fill', '#18b068');
    body.setAttribute('filter', 'url(#glow-green)');
    g.appendChild(body);

    const fold = document.createElementNS(NS, 'polyline');
    fold.setAttribute('points', '3,-6 3,-3 6,-3');
    fold.setAttribute('fill', 'none');
    fold.setAttribute('stroke', '#f0fff4');
    fold.setAttribute('stroke-width', '0.9');
    g.appendChild(fold);

    [[0], [2.5]].forEach(([dy]) => {
      const l = document.createElementNS(NS, 'line');
      Object.entries({ x1: -3, y1: dy, x2: 4, y2: dy,
        stroke: '#f0fff4', 'stroke-width': 0.65, opacity: 0.7 })
        .forEach(([k, v]) => l.setAttribute(k, v));
      g.appendChild(l);
    });

    document.getElementById('packets').appendChild(g);
    return g;
  }

  function animateSnapshot(srcIdx) {
    const src = PROC0_SOURCES[srcIdx];
    const pkt = makeSnapshotPkt(src.x, src.y);

    const cpx = (src.x + MLFLOW_CX) / 2;
    const cpy = (src.y + MLFLOW_CY) / 2 - 40;

    const state = { t: 0 };
    gsap.to(state, {
      t: 1, duration: 1.1, ease: 'power1.inOut',
      onUpdate() {
        const t = state.t, mt = 1 - t;
        const x = mt*mt*src.x + 2*mt*t*cpx + t*t*MLFLOW_CX;
        const y = mt*mt*src.y + 2*mt*t*cpy + t*t*MLFLOW_CY;
        pkt.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})`);
      },
      onComplete() {
        mlflowSaves++;
        if (mlflowSaves % 3 === 0) mlflowVersion++;
        document.getElementById('mlflow-saves').textContent   = mlflowSaves;
        document.getElementById('mlflow-version').textContent = `v${mlflowVersion}`;
        flashMLFlow();
        pkt.remove();
      },
    });
  }

  let mlflowBusy = false;
  function flashMLFlow() {
    if (mlflowBusy) return;
    mlflowBusy = true;
    const box = document.querySelector('#node-mlflow > rect');
    gsap.to(box, { attr: { stroke: '#40e090' }, duration: 0.1,
      onComplete: () => gsap.to(box, { attr: { stroke: '#1a9060' }, duration: 0.5,
        onComplete: () => { mlflowBusy = false; } }) });
  }

  function scheduleSnapshots() {
    PROC0_SOURCES.forEach((_, i) => {
      const firstDelay = 1.5 + i * 1.1 + Math.random();
      const go = (delay) => gsap.delayedCall(delay, () => {
        animateSnapshot(i);
        go(3.5 + Math.random() * 2.5);
      });
      go(firstDelay);
    });
  }

  // kick off — 5 s startup delay, nodes staggered 1.2 s apart
  gsap.delayedCall(5.0, () => {
    schedEventArrival(NODES[0], 0);
    NODES.forEach(n => startIntraNodeRing(n));
    startInterNodeRing();
    schedControlFeedback(NODES[0], 0.5);
    schedControlFeedback(NODES[1], 1.2);
    scheduleSnapshots();
  });
  gsap.delayedCall(6.2, () => schedEventArrival(NODES[1], 0));

  // Live frame timer
  (function () {
    const counter = document.getElementById('frame-counter');
    const t0 = performance.now();
    function tick() {
      counter.textContent = 't = ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
